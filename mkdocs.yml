site_name: adROIt-qc
site_description: Build a self-contained ROI quality-control reviewer from any segmentation output
site_url: !ENV [SITE_URL, '']
repo_url: https://github.com/najafi-laboratory/adROIt-qc
repo_name: najafi-laboratory/adROIt-qc

theme:
  name: readthedocs

markdown_extensions:
  # md_in_html is required: every screenshot sits inside <div class="screenshot" markdown>
  # for styling, and without this extension the image syntax inside is left unrendered.
  - md_in_html
  - attr_list
  - admonition
  - toc:
      permalink: true
  # Equations on the Metric Definitions page: $...$ and $$...$$ rendered by MathJax.
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Getting Started:
      - Tutorial: tutorial.md
      - Build Settings Explained: cli-mapping.md
  - The Reviewer:
      - Interface Reference: interface-reference.md
      - Metric Definitions: metrics.md
      - Export and Downstream Use: export.md
  - Reference:
      - Input Formats: inputs.md
      - Programmatic Reference: reference.md
