[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adroit-qc"
version = "0.2.0"
description = "adROIt-qc: interactive, self-contained ROI quality-control reviewer for two-photon calcium imaging sessions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "matplotlib",
    "pillow",
    "pyyaml",
]

[project.scripts]
adroit-qc = "adroit_qc.summary:main"
roi-reviewer = "adroit_qc.summary:main"

[tool.setuptools]
packages = ["adroit_qc", "roi_reviewer"]
